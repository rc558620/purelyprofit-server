# ─────────────────────────────────────────────────────────────────────────────
# 站点域（静态托管）：chunlibao.cn 全站
# ─────────────────────────────────────────────────────────────────────────────
# 部署路径：/etc/nginx/conf.d/chunlibao-sites.conf
#
#   chunlibao.cn        → purelyProfit 商家端（/var/www/purelyprofit/current）
#   www.chunlibao.cn    → 301 到 chunlibao.cn（避免重复源与 CORS 白名单分叉）
#   pulse.chunlibao.cn  → purelyPulse 平台运营端（/var/www/purelypulse/current）
#   club.chunlibao.cn   → purelyClub 邀请入口 H5（/var/www/club/current）
#   scan.chunlibao.cn   → 桌码 / 空间码入口（微信「扫普通链接二维码」在客户端拦截，
#                          浏览器直接访问时给提示页；不得与 club 共用域名，
#                          否则邀请码会被空间码规则一并唤起小程序）
#
# 三个 SPA 目录均由各自仓库的 deploy 工作流维护：$WEB_ROOT/current 指向具体版本。
# 证书与 api.chunlibao.cn 共用一张泛域名证书；按子域单独签发时逐个替换。
# ─────────────────────────────────────────────────────────────────────────────

# ─── HTTP：统一跳 HTTPS（www 额外收敛到根域）────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name chunlibao.cn pulse.chunlibao.cn club.chunlibao.cn scan.chunlibao.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.chunlibao.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://chunlibao.cn$request_uri;
    }
}

# ─── www → 根域（HTTPS）─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.chunlibao.cn;

    ssl_certificate /etc/letsencrypt/live/chunlibao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunlibao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://chunlibao.cn$request_uri;
}

# ─── purelyProfit 商家端 ────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chunlibao.cn;

    ssl_certificate /etc/letsencrypt/live/chunlibao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunlibao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/purelyprofit/current;
    index index.html;

    # 前端 HTTP_CONFIG.baseURL 默认 /api、Socket 默认同源：必须在本域反代后端，
    # 否则接口与实时连接全部 404（同源也就完全不需要 CORS）
    include /etc/nginx/snippets/purelyprofit-api-proxy.inc;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # 带内容哈希的构建产物可长期强缓存；index.html 必须禁缓存，否则发版后仍是旧壳
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # SPA 深链兜底：/login、/dashboard 等前端路由刷新不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── purelyPulse 平台运营端 ─────────────────────────────────────────────────
# 注意：purelyPulse 仓库当前的 deploy.yml 只发 GitHub Pages，尚未包含服务器 SSH 部署；
#       在补上 server 目标之前，本块没有产物，访问会落到下面 SPA 兜底的 404。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pulse.chunlibao.cn;

    ssl_certificate /etc/letsencrypt/live/chunlibao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunlibao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/purelypulse/current;
    index index.html;

    # purelyPulse 的 VITE_API_BASE_URL 默认 /api：同源反代，避免跨域与 CORS 白名单维护
    include /etc/nginx/snippets/purelyprofit-api-proxy.inc;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── purelyClub 邀请入口 H5 ─────────────────────────────────────────────────
# 对应后端 CLUB_PUBLIC_BASE_URL=https://club.chunlibao.cn，二维码形如
# {base}/i/v1/{inviteCode}；该域名已印进物料，属永久资产，只增不换。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name club.chunlibao.cn;

    ssl_certificate /etc/letsencrypt/live/chunlibao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunlibao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/club/current;
    index index.html;

    # 微信「扫普通链接二维码」规则需要域名归属校验文件；
    # 放在共享目录而不是 releases 里，避免每次发版切换软链后校验文件消失。
    location ^~ /WW_verify_ {
        root /var/www/club/verify;
    }

    # 邀请落地页需要调接口校验邀请码 / 记录来源：同源反代，避免 H5 侧再维护一份跨域配置
    include /etc/nginx/snippets/purelyprofit-api-proxy.inc;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # 二维码已印进物料，域名不能 404：H5 产物尚未就位时返回可读提示页，
    # 微信客户端命中「扫普通链接二维码」规则时会直接唤起小程序，不会走到这里。
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    error_page 404 = @club_fallback;

    location @club_fallback {
        default_type text/html;
        return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纯利宝</title></head><body style="font-family:-apple-system,sans-serif;text-align:center;padding:20vh 24px;color:#333"><p style="font-size:17px">请在微信中打开邀请链接</p></body></html>';
    }
}

# ─── 桌码 / 空间码入口 ──────────────────────────────────────────────────────
# 对应后端 SCAN_QR_BASE_URL=https://scan.chunlibao.cn
# 微信客户端按「扫普通链接二维码」规则直接唤起小程序，不请求本服务器；
# 浏览器直接访问时落到提示页，保证域名可用性探测与用户误扫有兜底。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name scan.chunlibao.cn;

    ssl_certificate /etc/letsencrypt/live/chunlibao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunlibao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    default_type text/html;
    location / {
        return 200 '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纯利宝</title></head><body style="font-family:-apple-system,sans-serif;text-align:center;padding:20vh 24px;color:#333"><p style="font-size:17px">请使用微信扫描桌面二维码进入小程序</p></body></html>';
    }
}
