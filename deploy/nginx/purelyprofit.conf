# 部署前必须替换所有 api.example.com 为真实 API 域名，并确认 DNS 已解析到此服务器。
# 若管理端与 API 同域，前端会默认连接当前域名的 /socket.io/；若不同域，构建前设置
# VITE_SOCKET_BASE_URL=https://真实API域名，且该域名必须保留下面的 /socket.io/ location。
# HTTPS 页面只能建立 wss:// 连接；证书缺失、域名不匹配或证书过期都会导致 WebSocket 握手失败。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream purelyprofit_api {
    # Docker / Kubernetes 部署时改为容器服务名和端口，例如 purelyprofit-server:3000。
    # 若后端同时运行多个 Node 进程或多个实例，Nginx 负载均衡本身不会同步 Socket.IO 房间；
    # 必须在服务端配置 Socket.IO Redis adapter，否则连接在实例 A、事件由实例 B 发布时会丢推送。
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    # 首次申请或续期 Let's Encrypt 证书时，80 端口必须可从公网访问。
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # 路径必须与真实证书一致；修改后运行 nginx -t，再 reload Nginx。
    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # purelyProfit 管理端 Socket.IO。删除 Upgrade / Connection / HTTP/1.1 任一项会
    # 使连接退回 polling 或直接失败；上线后浏览器应显示 101 Switching Protocols。
    location /socket.io/ {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 是长连接；默认代理超时偏短会造成客户端持续断线重连。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # purelyClub 微信小程序原生 WebSocket。该路径与 Socket.IO 协议不同，
    # 不能合并、重写到 /socket.io/，否则小程序订单状态推送会失败。
    location /api/ws/scan-ordering {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 常规 REST API；此处不需要 Upgrade 头。
    location /api/ {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
