# 部署前必须替换所有 api.example.com 为真实 API 域名，并确认 DNS 已解析到负载均衡器。
# 同机 Node Cluster 共享一个 3000 端口时，仅保留一个 upstream server；多个独立实例时增加 server 行。
# 多实例必须保持 Redis Pub/Sub 与 Socket.IO Redis adapter 可用；前者负责原生 WebSocket 业务事件，后者同步 Socket.IO 房间与跨节点操作。
# 管理端与 API 不同域时，构建 purelyProfit 前设置 VITE_SOCKET_BASE_URL=https://真实API域名。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream purelyprofit_api {
    # 同机 Cluster 或单实例：只使用一个本地入口。
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;

    # 多服务器时替换上一行或增加实际私网地址。健康检查失败实例会暂时被剔除。
    # server 10.0.10.11:3000 max_fails=3 fail_timeout=10s;
    # server 10.0.10.12:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # 管理端 Socket.IO：缺少 HTTP/1.1、Upgrade 或 Connection 任一配置，WebSocket 将失败或退化为 polling。
    location /socket.io/ {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 微信小程序原生 WebSocket；不得重写或合并到 /socket.io/，两者协议不同。
    location /api/ws/scan-ordering {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 就绪探针用于负载均衡与发布脚本；Redis 或实时订阅异常会返回 error。
    location = /api/readyz {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://purelyprofit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
