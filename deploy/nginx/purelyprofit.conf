# ─────────────────────────────────────────────────────────────────────────────
# API 子域：api.chunlibao.cn（purelyprofit-server 反向代理）
# ─────────────────────────────────────────────────────────────────────────────
# 部署路径：/etc/nginx/conf.d/api.chunlibao.cn.conf
# 依赖片段：/etc/nginx/snippets/purelyprofit-api-proxy.inc（本目录 snippets/ 下）
#
# 证书约定：推荐一张泛域名证书覆盖 chunlibao.cn + *.chunlibao.cn
#   certbot certonly --dns-<插件> -d chunlibao.cn -d '*.chunlibao.cn'
# 若按子域分别签发，把下方 ssl_certificate 换成
#   /etc/letsencrypt/live/api.chunlibao.cn/{fullchain,privkey}.pem
#
# 使用方：
#   - purelyClub 小程序（必须绝对域名，不能用相对 /api）：
#       TARO_APP_API_BASE_URL=https://api.chunlibao.cn/api（/api 前缀必须带，见下方 location）
#       TARO_APP_WS_BASE_URL=https://api.chunlibao.cn（WS 路径自带 /api/ws/，此处不带前缀）
#     微信公众平台需登记 request 合法域名 https://api.chunlibao.cn
#     与 socket 合法域名 wss://api.chunlibao.cn
#   - 微信支付回调（三个 notify 地址都指向本域，见 deploy/production.env.example）
#   - 跨域部署的管理端（此时才需要 APP_CORS_ORIGIN 白名单）
#
# 注意：purelyProfit / purelyPulse 默认走同源 /api，由 chunlibao-sites.conf 代理，
#       不经过本子域，正常情况下不产生任何跨域请求。
# ─────────────────────────────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream purelyprofit_api {
    # 同机 Cluster 共享一个 3000 入口；多实例时补充私网地址，健康检查失败会被暂时剔除。
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.chunlibao.cn;

    # Let's Encrypt 校验目录；泛域名证书走 DNS-01 时同样可保留
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.chunlibao.cn;

    ssl_certificate /etc/letsencrypt/live/chunlibao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chunlibao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传体积与后端 APP_HTTP_BODY_LIMIT_BYTES（5MB）保持一致，避免两端限流口径分叉
    client_max_body_size 6m;

    # /socket.io/、/api/ws/、/api/readyz、/api/ 全部在此片段内，与站点域共用同一份定义
    include /etc/nginx/snippets/purelyprofit-api-proxy.inc;

    # API 子域不托管任何静态资源，未命中前缀的请求直接拒绝，
    # 避免把纯前端文件误暴露到接口域。
    location / {
        return 404;
    }
}
