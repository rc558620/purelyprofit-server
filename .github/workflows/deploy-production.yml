# ┌─────────────────────────────────────────────────────────────────────────┐
# │  部署流水线：CI 在 main 分支成功后自动发布，也支持手动触发。            │
# │                                                                         │
# │  自动链路：push main → CI(质量门/构建) 成功 → workflow_run → 本文件     │
# │  手动链路：Actions 面板手动 Run workflow（默认 dry-run 预演）           │
# │                                                                         │
# │  执行方式：GitHub 托管 runner 通过 SSH 登录生产服务器，在服务器本地完成 │
# │  「解包 → prisma migrate deploy → 切 current 软链 → 重启 systemd → 健康  │
# │  检查 → 失败回滚」，脚本见 deploy/scripts/remote-release.sh。            │
# │                                                                         │
# │  域名规划（生产）：                                                      │
# │    chunlibao.cn / www.chunlibao.cn  → purelyProfit 商家端静态站          │
# │    api.chunlibao.cn                 → purelyprofit-server API + WS       │
# │    pulse.chunlibao.cn               → purelyPulse 平台运营端             │
# │    club.chunlibao.cn                → purelyClub 邀请入口 H5             │
# │    scan.chunlibao.cn                → 桌码 / 空间码入口（勿与 club 混用）│
# │                                                                         │
# │  必需 Secrets：SSH_HOST / SSH_USER / SSH_KEY（可选 SSH_PORT）            │
# │              SSH_REMOTE_TMP                                            │
# │  必需 Variables：无（有默认值），可用 APP_ROOT / APP_SERVICE /           │
# │              APP_ENV_FILE / APP_HEALTHCHECK_URL 覆盖默认路径             │
# │  运行时配置：统一由服务器 ${APP_ENV_FILE} 承载，不再从 GitHub 注入，     │
# │              避免 CI 变量与服务器环境文件两处漂移。                      │
# │  自动部署总开关：Variables.AUTO_DEPLOY_ENABLED（设为 false 降级为手动）  │
# └─────────────────────────────────────────────────────────────────────────┘
name: Deploy Production

on:
  # CI 跑完即触发：只认 conclusion=success 且来源分支为 main 的 CI 运行，
  # fork PR 的 CI 运行时 head_branch 不是 main，不会命中自动部署。
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry-run（只在服务器打印发布计划，不做任何变更）
        required: true
        default: true
        type: boolean
      skip_migrate_deploy:
        description: 跳过 prisma migrate deploy
        required: true
        default: false
        type: boolean
      skip_smoke:
        description: 跳过发布后的公网健康检查
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  # 下载 CI 上传的构建产物需要 actions: read
  actions: read

concurrency:
  group: deploy-production
  # 部署不可中断：半途取消会把服务器停在「新产物 + 旧软链」或半迁移状态
  cancel-in-progress: false

# 时区与 deploy/systemd 保持一致：业务日/月/周边界按上海时区计算
env:
  CI: 'true'
  NODE_ENV: production
  TZ: Asia/Shanghai
  APP_DOMAIN: ${{ vars.APP_DOMAIN || 'chunlibao.cn' }}
  API_DOMAIN: ${{ vars.API_DOMAIN || 'api.chunlibao.cn' }}

jobs:
  deploy:
    name: Deploy to Production
    # 手动触发始终执行；自动触发要求：CI 成功 + 来源分支 main + 自动部署开关未关闭。
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && vars.AUTO_DEPLOY_ENABLED != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    env:
      APP_ROOT: ${{ vars.APP_ROOT || '/opt/purelyprofit-server' }}
      APP_SERVICE: ${{ vars.APP_SERVICE || 'purelyprofit-server' }}
      APP_ENV_FILE: ${{ vars.APP_ENV_FILE || '/etc/purelyprofit-server/production.env' }}
      APP_HEALTHCHECK_URL: ${{ vars.APP_HEALTHCHECK_URL || 'http://127.0.0.1:3000/api/readyz' }}
      APP_KEEP_RELEASES: ${{ vars.APP_KEEP_RELEASES || '5' }}
      RELEASE_REQUIRE_BACKUP: ${{ vars.RELEASE_REQUIRE_BACKUP || 'true' }}
    steps:
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          # workflow_run 场景下 GITHUB_SHA 是部署 workflow 所在分支的 HEAD，
          # 真正要发布的是触发 CI 的那次提交，必须显式对齐，避免发布错版本。
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
            branch="${{ github.event.workflow_run.head_branch }}"
          else
            sha="${GITHUB_SHA}"
            branch="${GITHUB_REF_NAME}"
          fi

          if [ "${branch}" != 'main' ]; then
            echo "::error::Production deploy only supports main branch, got: ${branch}"
            exit 1
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "trigger=${GITHUB_EVENT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 版本统一由 .nvmrc 决定，避免与 CI / 本地开发出现版本漂移
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      # 复用 CI 已构建的产物：保证「CI 验证过的那份代码」与「线上运行的那份产物」一致。
      - name: Download CI build artifact
        id: artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: app-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build strategy
        id: build_strategy
        shell: bash
        run: |
          set -euo pipefail
          if [ -f dist/src/main.js ] && [ -f dist/cluster-main.js ] && [ -f dist/config/cluster.configuration.js ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo '复用 CI 构建产物，跳过本机构建'
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
            echo '未获取到 CI 构建产物，回退为在本机执行构建'
          fi

      - name: Build application
        if: ${{ steps.build_strategy.outputs.skip != 'true' }}
        run: pnpm run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/src/main.js || { echo '::error::dist/src/main.js 缺失'; exit 1; }
          test -f dist/cluster-main.js || { echo '::error::dist/cluster-main.js 缺失'; exit 1; }
          test -f dist/config/cluster.configuration.js || { echo '::error::dist/config/cluster.configuration.js 缺失'; exit 1; }
          echo '构建产物校验通过'

      # 产物自带 package.json / pnpm-lock.yaml / prisma，保证服务器侧依赖安装与迁移可复现；
      # 同时带上服务器端发布脚本，只需传输一个文件，避免多文件路径漂移。
      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "release-${{ steps.target.outputs.sha }}.tar.gz" \
            dist prisma prisma.config.ts package.json pnpm-lock.yaml deploy/scripts/remote-release.sh
          ls -lh "release-${{ steps.target.outputs.sha }}.tar.gz"

      - name: Verify SSH settings
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          # secrets 不能出现在 job 级 if 中（会被判空），因此在步骤内做前置校验
          [ -n "${SSH_HOST}" ] || { echo '::error::缺少 Secrets.SSH_HOST'; exit 1; }
          [ -n "${SSH_USER}" ] || { echo '::error::缺少 Secrets.SSH_USER'; exit 1; }
          [ -n "${SSH_KEY}" ] || { echo '::error::缺少 Secrets.SSH_KEY'; exit 1; }

      - name: Upload release archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: release-${{ steps.target.outputs.sha }}.tar.gz
          target: ${{ secrets.SSH_REMOTE_TMP || '/tmp' }}
          overwrite: true

      - name: Execute remote release
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_ID: ${{ steps.target.outputs.sha }}
          REMOTE_TMP: ${{ secrets.SSH_REMOTE_TMP || '/tmp' }}
          APP_ROOT: ${{ env.APP_ROOT }}
          APP_SERVICE: ${{ env.APP_SERVICE }}
          APP_ENV_FILE: ${{ env.APP_ENV_FILE }}
          APP_HEALTHCHECK_URL: ${{ env.APP_HEALTHCHECK_URL }}
          APP_KEEP_RELEASES: ${{ env.APP_KEEP_RELEASES }}
          RELEASE_REQUIRE_BACKUP: ${{ env.RELEASE_REQUIRE_BACKUP }}
          # 自动触发时 inputs 为空 → dry_run=false（真实发布）；
          # 手动触发时沿用面板输入，默认仍是 dry-run 预演。
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          RELEASE_SKIP_MIGRATE_DEPLOY: ${{ inputs.skip_migrate_deploy && 'true' || 'false' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          command_timeout: 30m
          # 单行逗号分隔：多行折叠会在逗号后插入空格，导致变量名不匹配
          envs: RELEASE_ID,REMOTE_TMP,APP_ROOT,APP_SERVICE,APP_ENV_FILE,APP_HEALTHCHECK_URL,APP_KEEP_RELEASES,RELEASE_REQUIRE_BACKUP,RELEASE_DRY_RUN,RELEASE_SKIP_MIGRATE_DEPLOY
          script: |
            set -euo pipefail
            ARCHIVE="${REMOTE_TMP}/release-${RELEASE_ID}.tar.gz"
            [ -f "${ARCHIVE}" ] || { echo "✗ 产物不存在: ${ARCHIVE}"; exit 1; }

            # 先单独解出发布脚本再执行：脚本随产物一起传输，版本与代码强一致
            WORK_DIR="${REMOTE_TMP}/purelyprofit-release-${RELEASE_ID}"
            rm -rf "${WORK_DIR}" && mkdir -p "${WORK_DIR}"
            tar -xzf "${ARCHIVE}" -C "${WORK_DIR}" deploy/scripts/remote-release.sh

            bash "${WORK_DIR}/deploy/scripts/remote-release.sh"

      - name: Verify public endpoint
        if: >-
          success() && !inputs.skip_smoke &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        shell: bash
        run: |
          set -euo pipefail
          url="https://${API_DOMAIN}/api/readyz"
          echo "检查公网就绪探针：${url}"
          # 公网检查覆盖 DNS → 证书 → Nginx → 后端整条链路。
          # 注意 /api/readyz 依赖异常时仍是 HTTP 200，只把 body.status 置为 error，
          # 因此必须解析响应体，否则数据库/Redis 挂掉也会被判定为发布成功。
          for attempt in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 "${url}" || true)"
            # 用 node 解析而不是内联 python：python -c 对首行缩进敏感，
            # 在 YAML block scalar 里极易触发 IndentationError；JS 不敏感缩进。
            if [ -n "${body}" ] && printf '%s' "${body}" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => (raw += chunk));
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const deps = payload.dependencies ?? [];
              console.log("  " + deps.map((item) => item.name + "=" + item.status).join(", "));
              const ok =
                payload.status === "ok" &&
                deps.length > 0 &&
                deps.every((item) => item.status === "up");
              process.exit(ok ? 0 : 1);
            });
            '; then
              echo "公网就绪探针通过"
              exit 0
            fi
            sleep 3
          done
          echo "::error::公网就绪探针失败：${url}，最后响应：${body:-无}"
          exit 1

      - name: Publish deploy summary
        if: always()
        shell: bash
        env:
          RELEASE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          {
            echo '## Deploy Production'
            echo "- Result: ${{ job.status }}"
            echo "- Trigger: ${{ steps.target.outputs.trigger || github.event_name }}"
            echo "- Branch: ${{ steps.target.outputs.branch || github.ref_name }}"
            echo "- Commit: ${{ steps.target.outputs.sha || github.sha }}"
            echo "- Dry run: ${RELEASE_DRY_RUN}"
            echo "- Reuse CI artifact: ${{ steps.build_strategy.outputs.skip || 'unknown' }}"
            echo "- Skip migrate deploy: ${{ inputs.skip_migrate_deploy || false }}"
            echo "- Skip smoke: ${{ inputs.skip_smoke || false }}"
            echo "- API domain: ${API_DOMAIN}"
            echo "- App root: ${APP_ROOT}"
            echo "- Service: ${APP_SERVICE}"
            if [ "${{ job.status }}" != 'success' ]; then
              echo ''
              echo '> 发布失败：远程脚本已尝试回滚到上一个版本。请查看上方 SSH 输出中的失败阶段与备份路径；'
              echo '> 若已执行迁移，需先用 pg_restore 回滚数据库，再重新发布修复版本。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
